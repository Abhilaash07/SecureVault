name: SecureVault E2E Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  web-tests:
    name: Selenium Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./selenium-tests
        run: npm install
        
      - name: Run Web Tests (Mocked for CI)
        working-directory: ./selenium-tests
        run: npm run test:ci

      - name: Generate and Upload Web Excel Report
        working-directory: ./selenium-tests
        run: node run-all.js
        
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-web-test-report
          path: ./selenium-tests/reports/*.xlsx

  mobile-tests:
    name: Appium Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./frontend/appium-tests
        run: npm install
        
      - name: Run Mobile Tests (Mocked for CI)
        working-directory: ./frontend/appium-tests
        run: npm run test:ci

      - name: Generate and Upload Mobile Excel Report
        working-directory: ./frontend/appium-tests
        run: node run-all.js
        
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-mobile-test-report
          path: ./frontend/appium-tests/reports/*.xlsx

  load-tests:
    name: k6 Load & Baseline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./load-tests
        run: npm install
          
      - name: Run Load Tests (300 VUs)
        working-directory: ./load-tests
        run: node run-load-test.js
        
      - name: Upload Load Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: ./load-tests/reports/*.xlsx
